name: Build
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ebus-zephyr
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: ebus-zephyr
          toolchains: arm-zephyr-eabi
      - name: Build application
        working-directory: ebus-zephyr
        shell: bash
        run: |
          west build -b frdm_mcxn947/mcxn947/cpu0 application
